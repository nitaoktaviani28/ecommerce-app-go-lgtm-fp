apiVersion: 1
groups:
  - orgId: 1
    name: AKS Node Health
    folder: AKS Alerts
    interval: 1m
    rules:
      - uid: aks-alert-node-cpu-high
        title: High Node CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: '100 - (avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Node CPU usage is above 85%"
          description: "Node CPU usage has been high for more than 5 minutes. Check workload distribution."
        labels:
          severity: warning
          team: infrastructure

      - uid: aks-alert-node-memory-high
        title: High Node Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: '100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Node Memory usage is above 85%"
          description: "Memory usage has been high for more than 5 minutes. Consider scaling nodes."
        labels:
          severity: warning
          team: infrastructure

      - uid: aks-alert-node-disk-high
        title: High Node Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: 'max(100 * (1 - (node_filesystem_free_bytes{fstype!="tmpfs",fstype!="overlay"} / node_filesystem_size_bytes{fstype!="tmpfs",fstype!="overlay"})))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Node Disk usage is above 85%"
          description: "Disk is running out of space. Investigate and clean up."
        labels:
          severity: critical
          team: infrastructure

  - orgId: 1
    name: AKS Pod Health
    folder: AKS Alerts
    interval: 1m
    rules:
      - uid: aks-alert-pod-restart-high
        title: Pod Restart Loop Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              expr: 'max by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace="ecommerce"}[10m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "Pod in ecommerce namespace has restarted more than 3 times in 10 minutes"
          description: "A pod is in a restart loop. Check pod logs for crash reasons."
        labels:
          severity: critical
          team: backend

      - uid: aks-alert-container-cpu-high
        title: High Container CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: 'max by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace="ecommerce", container!=""}[5m]) * 100)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Container CPU usage exceeds 80% in ecommerce namespace"
          description: "A container is consuming high CPU. Consider scaling or optimizing."
        labels:
          severity: warning
          team: backend

      - uid: aks-alert-container-memory-high
        title: High Container Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: 'max by (namespace, pod) (container_memory_working_set_bytes{namespace="ecommerce", container!=""} / container_spec_memory_limit_bytes{namespace="ecommerce", container!=""} * 100)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Container memory usage exceeds 85% of limit"
          description: "A container is close to its memory limit. Risk of OOMKill."
        labels:
          severity: warning
          team: backend

      - uid: aks-alert-pod-not-ready
        title: Pod Not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: 'min by (namespace, pod) (kube_pod_status_ready{namespace="ecommerce", condition="true"})'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Pod in ecommerce namespace is not ready"
          description: "A pod has been in not-ready state for more than 5 minutes."
        labels:
          severity: critical
          team: backend

  - orgId: 1
    name: AKS Frontend (Faro)
    folder: AKS Alerts
    interval: 1m
    rules:
      - uid: aks-alert-frontend-errors-high
        title: High Frontend Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({source="frontend"} | logfmt | kind=~"exception|log" [5m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Frontend has more than 50 errors/exceptions in 5 minutes"
          description: "High number of frontend errors detected via Faro RUM. Check browser console errors."
        labels:
          severity: warning
          team: frontend

      - uid: aks-alert-frontend-http-errors
        title: High Frontend HTTP Error Rate (4xx/5xx)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({source="frontend"} | logfmt | kind=~"event" | event_name=~"faro.tracing.*" | event_data_http_status_code=~"[4-5][0-9]{2}" [5m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [20]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "More than 20 HTTP 4xx/5xx errors from frontend in 5 minutes"
          description: "Frontend is experiencing high HTTP error rate. Check API gateway and backend services."
        labels:
          severity: critical
          team: frontend

      - uid: aks-alert-no-frontend-traffic
        title: No Frontend Traffic Detected
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({source="frontend"} [10m]))'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                    params: []
              refId: C
        noDataState: Alerting
        execErrState: OK
        for: 10m
        annotations:
          summary: "No frontend traffic detected for 10 minutes"
          description: "Faro collector is not receiving any data. Frontend or collector may be down."
        labels:
          severity: critical
          team: infrastructure
