# Secret harus dibuat manual via kubectl (JANGAN commit secret ke git):
# kubectl create secret generic bedrock-proxy-secrets \
#   --namespace=ecommerce \
#   --from-literal=AWS_ACCESS_KEY_ID=<your-key> \
#   --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret> \
#   --from-literal=SMTP_PASSWORD=<your-smtp-password>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrock-proxy
  namespace: ecommerce
  labels:
    app: bedrock-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bedrock-proxy
  template:
    metadata:
      labels:
        app: bedrock-proxy
    spec:
      containers:
        - name: bedrock-proxy
          image: docker.io/nitaoktaviani28/ecommerce-bedrock-proxy:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: MODEL_ID
              value: "amazon.nova-lite-v1:0"
            - name: SMTP_HOST
              value: "smtp.gmail.com"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: "nitaoktaviani2005@gmail.com"
            - name: ALERT_EMAIL_TO
              value: "nitaoktaviani2005@gmail.com"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bedrock-proxy-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrock-proxy-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bedrock-proxy-secrets
                  key: SMTP_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bedrock-proxy
  namespace: ecommerce
  labels:
    app: bedrock-proxy
spec:
  type: ClusterIP
  selector:
    app: bedrock-proxy
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
