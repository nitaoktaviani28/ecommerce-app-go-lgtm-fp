version: "3.8"

services:
  # ===== Application Services =====
  frontend:
    image: haechanlovelove/ecommerce-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://172.188.11.67:8080/api
      - VITE_FARO_COLLECTOR_URL=http://172.188.11.67:12347/collect
      - VITE_APP_NAME=ecommerce-frontend
      - VITE_APP_VERSION=1.0.0
      - VITE_APP_ENV=production
    networks:
      - ecommerce
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  api-gateway:
    image: haechanlovelove/ecommerce-api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4318
    networks:
      - ecommerce
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  product-service:
    image: haechanlovelove/ecommerce-product:latest
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce123@postgres:5432/ecommerce?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4318
    networks:
      ecommerce:
        aliases:
          - product-service.ecommerce.svc.cluster.local
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  order-service:
    image: haechanlovelove/ecommerce-order:latest
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce123@postgres:5432/ecommerce?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4318
    networks:
      ecommerce:
        aliases:
          - order-service.ecommerce.svc.cluster.local
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  user-service:
    image: haechanlovelove/ecommerce-user:latest
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce123@postgres:5432/ecommerce?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4318
    networks:
      ecommerce:
        aliases:
          - user-service.ecommerce.svc.cluster.local
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  payment-service:
    image: haechanlovelove/ecommerce-payment:latest
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce123@postgres:5432/ecommerce?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=alloy:4318
    networks:
      ecommerce:
        aliases:
          - payment-service.ecommerce.svc.cluster.local
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ===== Database =====
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce123
      - POSTGRES_DB=ecommerce
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ===== Observability - Grafana LGTM Stack =====
  loki:
    image: grafana/loki:3.7.0
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki-config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  mimir:
    image: grafana/mimir:2.16.0
    ports:
      - "9009:9009"
    volumes:
      - mimir-data:/mimir
    configs:
      - source: mimir-config
        target: /etc/mimir/mimir.yaml
      - source: mimir-alertmanager-fallback
        target: /mimir/alertmanager-fallback.yaml
    command:
      - -config.file=/etc/mimir/mimir.yaml
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  tempo:
    image: grafana/tempo:2.7.2
    ports:
      - "3200:3200"
    volumes:
      - tempo-data:/var/tempo
    configs:
      - source: tempo-config
        target: /etc/tempo/tempo.yaml
    command:
      - -config.file=/etc/tempo/tempo.yaml
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  pyroscope:
    image: grafana/pyroscope:1.13.0
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/data
    configs:
      - source: pyroscope-config
        target: /etc/pyroscope/config.yaml
    command:
      - -config.file=/etc/pyroscope/config.yaml
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  alloy:
    image: grafana/alloy:v1.9.1
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12347:12347"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /:/rootfs:ro
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
    networks:
      ecommerce:
        aliases:
          - alloy.monitoring.svc.cluster.local
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # ===== Grafana UI =====
  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # SMTP for Alert Notifications
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=nitaoktaviani2005@gmail.com
      - GF_SMTP_PASSWORD=eizdtilrlqcnyzui
      - GF_SMTP_FROM_ADDRESS=nitaoktaviani2005@gmail.com
      - GF_SMTP_FROM_NAME=Grafana Docker Swarm
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # LLM Plugin (connected to bedrock-proxy)
      - GF_INSTALL_PLUGINS=grafana-llm-app
      - GF_PLUGIN_GRAFANA_LLM_APP_ENABLED=true
      - GF_PLUGIN_GRAFANA_LLM_APP_OPENAI_URL=http://bedrock-proxy:4000
      - GF_PLUGIN_GRAFANA_LLM_APP_OPENAI_API_KEY=sk-grafana-llm-proxy-key
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana-dashboards-provisioning
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana-dashboard-faro
        target: /etc/grafana/provisioning/dashboards/json/faro-dashboard.json
      - source: grafana-dashboard-mimir
        target: /etc/grafana/provisioning/dashboards/json/mimir-infra-dashboard.json
      - source: grafana-alerting-rules
        target: /etc/grafana/provisioning/alerting/alert-rules.yaml
      - source: grafana-alerting-contact-points
        target: /etc/grafana/provisioning/alerting/contact-points.yaml
      - source: grafana-alerting-policies
        target: /etc/grafana/provisioning/alerting/notification-policies.yaml
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ===== AI Incident Summary (AWS Bedrock Proxy) =====
  bedrock-proxy:
    image: bedrock-proxy:latest
    ports:
      - "4000:4000"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
      - MODEL_ID=amazon.nova-lite-v1:0
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=nitaoktaviani2005@gmail.com
      - SMTP_PASSWORD=eizdtilrlqcnyzui
      - ALERT_EMAIL_TO=nitaoktaviani2005@gmail.com
    networks:
      - ecommerce
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

configs:
  loki-config:
    file: ./configs/loki/loki-config.yaml
  alloy-config:
    file: ./configs/alloy/alloy-config.alloy
  grafana-datasources:
    file: ./configs/grafana/provisioning/datasources/datasources.yaml
  grafana-dashboards-provisioning:
    file: ./configs/grafana/provisioning/dashboards/dashboards.yaml
  grafana-dashboard-faro:
    file: ./configs/grafana/dashboards-json/faro-dashboard.json
  grafana-dashboard-mimir:
    file: ./configs/grafana/dashboards-json/mimir-infra-dashboard.json
  grafana-alerting-rules:
    file: ./configs/grafana/provisioning/alerting/alert-rules.yaml
  grafana-alerting-contact-points:
    file: ./configs/grafana/provisioning/alerting/contact-points.yaml
  grafana-alerting-policies:
    file: ./configs/grafana/provisioning/alerting/notification-policies.yaml
  mimir-config:
    file: ./configs/mimir/mimir-config.yaml
  mimir-alertmanager-fallback:
    file: ./configs/mimir/alertmanager-fallback.yaml
  tempo-config:
    file: ./configs/tempo/tempo-config.yaml
  pyroscope-config:
    file: ./configs/pyroscope/pyroscope-config.yaml

networks:
  ecommerce:
    driver: overlay

volumes:
  postgres-data:
  loki-data:
  grafana-data:
  mimir-data:
  tempo-data:
  pyroscope-data:
